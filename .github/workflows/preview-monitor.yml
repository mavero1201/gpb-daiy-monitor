name: Weekly Daily Banking monitor

on:
  workflow_dispatch:
  schedule:
    # 09:00 Moscow = 06:00 UTC. Moscow does not use DST.
    - cron: "0 6 * * 1"

concurrency:
  group: weekly-daily-banking-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression baseline
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build and publish monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1004291568481"
          STRICT_SOURCES: "1"
        run: python preview.py

      - name: Upload audit journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-monitor-audit
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 90
