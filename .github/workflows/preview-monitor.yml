name: Weekly Daily Banking monitor

on:
  workflow_dispatch:
  schedule:
    # Primary: 09:07 Moscow = 06:07 UTC.
    # Backup: 10:10 Moscow = 07:10 UTC.
    # The backup exits without publishing if the primary run already succeeded.
    - cron: "7 6 * * 1"
    - cron: "10 7 * * 1"

concurrency:
  group: weekly-daily-banking-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression baseline
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build and publish monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1004291568481"
          STRICT_SOURCES: "1"
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python preview.py

      - name: Persist publication state
        if: success()
        run: |
          if [ -f data/state.json ]; then
            git config user.name "gpb-daily-monitor"
            git config user.email "actions@users.noreply.github.com"
            git add data/state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update monitor publication state"
              git push
            fi
          fi

      - name: Upload audit journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-monitor-audit
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 90
