name: Validate monitor changes

on:
  pull_request:
    paths:
      - 'evaluator.py'
      - 'pipeline.py'
      - 'preview.py'
      - 'quality.py'
      - 'tests/**'
      - '.github/workflows/validate-monitor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
